services:
  db:
    image: postgres:16
    container_name: blog_db
    restart: always
    environment:
      POSTGRES_DB: blog_project
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - /home/dimitrywu/.env

  redis:
    image: redis:7
    container_name: blog_redis
    ports:
      - "6379:6379"

  web:
    image: grayfen/mysubblog:latest
    container_name: blog_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    env_file:
      - /home/dimitrywu/.env
    volumes:
      - ./logs:/app/logs
      - /home/dimitrywu/dima-test1_bucket.json:/app/dima-test1_bucket.json:ro
    depends_on:
      - db
      - redis

  celery:
    image: grayfen/mysubblog:latest
    container_name: blog_celery
    command: >
      sh -c "python -m celery -A blog_project worker -l info"
    env_file:
      - /home/dimitrywu/.env
    volumes:
      - ./logs:/app/logs
      - /home/dimitrywu/dima-test1_bucket.json:/app/dima-test1_bucket.json:ro
    depends_on:
      - db
      - redis

  # celery-beat:
  #   image: grayfen/mysubblog:latest
  #   container_name: blog_celery_beat
  #   command: >
  #     sh -c "
  #     mkdir -p /app/celerybeat-data && \
  #     python -m celery -A blog_project beat -l info \
  #     --schedule=/app/celerybeat-data/celerybeat-schedule.db
  #     "
  #   env_file:
  #     - /home/dimitrywu/.env
  #   volumes:
  #     - ./logs:/app/logs
  #     - ./celerybeat/celerybeat-schedule:/app/celerybeat-schedule
  #     - /home/dimitrywu/dima-test1_bucket.json:/app/dima-test1_bucket.json:ro
  #   depends_on:
  #     - db
  #     - redis

  nginx:
    image: nginx:latest
    container_name: blog_nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/var/www/vueapp
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data: