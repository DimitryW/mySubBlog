services:
  db:
    image: postgres:16
    container_name: blog_db
    restart: always
    environment:
      POSTGRES_DB: blog_project
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - /home/dimitrywu/.env

  redis:
    image: redis:7
    container_name: blog_redis
    ports:
      - "6379:6379"

  web:
    image: grayfen/mysubblog:latest
    container_name: blog_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    env_file:
      - /home/dimitrywu/.env
    volumes:
      - ./logs:/app/logs
      - /home/dimitrywu/dima-test1_bucket.json:/app/dima-test1_bucket.json:ro
    depends_on:
      - db
      - redis

  celery:
    image: grayfen/mysubblog:latest
    container_name: blog_celery
    command: >
      sh -c "python -m celery -A blog_project worker -l info"
    env_file:
      - /home/dimitrywu/.env
    volumes:
      - ./logs:/app/logs
      - /home/dimitrywu/dima-test1_bucket.json:/app/dima-test1_bucket.json:ro
    depends_on:
      - db
      - redis

  # celery-beat:
  #   image: grayfen/mysubblog:latest
  #   container_name: blog_celery_beat
  #   command: >
  #     sh -c "
  #     mkdir -p /app/celerybeat-data && \
  #     python -m celery -A blog_project beat -l info \
  #     --schedule=/app/celerybeat-data/celerybeat-schedule.db
  #     "
  #   env_file:
  #     - /home/dimitrywu/.env
  #   volumes:
  #     - ./logs:/app/logs
  #     - ./celerybeat/celerybeat-schedule:/app/celerybeat-schedule
  #     - /home/dimitrywu/dima-test1_bucket.json:/app/dima-test1_bucket.json:ro
  #   depends_on:
  #     - db
  #     - redis

  # Nginx 反向代理 + 自動 SSL
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    labels:
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy=true"

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: acme-companion
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=grayfen@gmail.com 
    depends_on:
      - nginx-proxy

  nginx:
    image: nginx:latest
    container_name: blog_nginx
    restart: always
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=dmxstudio.site,blog.dmxstudio.site,www.dmxstudio.site      
      - LETSENCRYPT_HOST=dmxstudio.site,blog.dmxstudio.site,www.dmxstudio.site  
      - LETSENCRYPT_EMAIL=grayfen@gmail.com
    volumes:
      - ./frontend/dist:/var/www/vueapp
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
  certs:
  vhost:
  html:
  acme: