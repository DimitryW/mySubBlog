services:
  db:
    image: postgres:16
    container_name: blog_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  redis:
    image: redis:7
    container_name: blog_redis
    ports:
      - "6379:6379"

  web:
    image: grayfen/mysubblog:latest
    container_name: blog_web
    command: >
      sh -c "python manage.py migrate &&
         python manage.py collectstatic --noinput &&
         python manage.py runserver 0.0.0.0:8000"
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/gcs_key.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcs_key.json
    depends_on:
      - db
      - redis

  celery:
    image: grayfen/mysubblog:latest
    container_name: blog_celery
    command: >
      sh -c "python -m celery -A blog_project worker -l info"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/gcs_key.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcs_key.json
    depends_on:
      - db
      - redis

  # Nginx 反向代理 + 自動 SSL
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    labels:
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy=true"

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: acme-companion
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=grayfen@gmail.com 
    depends_on:
      - nginx-proxy

  nginx:
    image: nginx:latest
    container_name: blog_nginx
    restart: always
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${ADMIN_EMAIL}
    volumes:
      - ./frontend/dist:/var/www/vueapp
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
  certs:
  vhost:
  html:
  acme: