server {
    listen 80;
    server_name _;

    root /var/www/vueapp;
    index index.html;

    location /api/ {
        proxy_pass http://blog_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://blog_web:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /accounts/ {
        proxy_pass http://blog_web:8000/accounts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
