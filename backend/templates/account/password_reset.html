{% extends "base.html" %}
{% load i18n %}
{% block content %}


<div class="login-wrapper">
  <h3>{% trans "Password Reset Request" %}</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">{% trans "Send Reset Email" %}</button>
  </form>
</div>
{% endblock %}
